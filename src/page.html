<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src __CONNECT__; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F4F7" media="(prefers-color-scheme: light)">
<title>pvtshiiiiii</title>
<style>
:root{
  --bg:#0A0A0D;--elev:#121218;--surface:#17171E;--surface-2:#202029;--surface-3:#2A2A35;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#F4F4F6;--text-2:#A3A3AE;--text-3:#70707C;
  --accent:#7D82FF;--accent-strong:#5A5EEA;--accent-soft:rgba(125,130,255,.14);--on-accent:#FFFFFF;
  --me-1:#5A5EEA;--me-2:#7547DB;--them:#1C1C24;
  --danger:#FF6B6B;--danger-soft:rgba(255,107,107,.12);--ok:#3DDC97;--ok-soft:rgba(61,220,151,.12);--warn:#FFB547;--warn-soft:rgba(255,181,71,.12);
  --scrim:rgba(0,0,0,.55);--shadow:0 18px 50px rgba(0,0,0,.5);
  --r-xl:28px;--r-lg:22px;--r-md:16px;--r-sm:12px;
  --fs-display:1.875rem;--fs-title:1.0625rem;--fs-body:1rem;--fs-callout:.9375rem;--fs-caption:.8125rem;--fs-micro:.75rem;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F4F4F7;--elev:#FFFFFF;--surface:#FFFFFF;--surface-2:#EDEDF2;--surface-3:#E2E2E9;
    --line:rgba(10,10,20,.07);--line-2:rgba(10,10,20,.12);
    --text:#111116;--text-2:#5C5C69;--text-3:#8B8B97;
    --accent:#4F53E0;--accent-strong:#4F53E0;--accent-soft:rgba(79,83,224,.10);
    --them:#FFFFFF;--danger:#D93C3C;--danger-soft:rgba(217,60,60,.10);--ok:#18A06A;--ok-soft:rgba(24,160,106,.10);--warn:#B86E00;--warn-soft:rgba(184,110,0,.10);
    --scrim:rgba(10,10,20,.35);--shadow:0 18px 50px rgba(10,10,30,.18);
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:100%;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
@media (hover:hover){.btn:hover,.cbtn:hover,.key:hover,.opt:hover{filter:brightness(1.12)}.tb:hover{background:var(--surface-2)}}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{display:inline-flex;width:1.25rem;height:1.25rem;flex:none}
.ico svg{width:100%;height:100%}
.tnum{font-variant-numeric:tabular-nums}
#root{height:100%}
.view{height:100%;display:flex;flex-direction:column;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- onboarding / forms ---------- */
.page{flex:1;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.page .grow{flex:1}
.emblem{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(135deg,var(--me-1),var(--me-2));box-shadow:0 12px 30px rgba(90,94,234,.35);margin-bottom:22px}
.emblem .ico{width:30px;height:30px}
.emblem.warn{background:linear-gradient(135deg,#F59E0B,#EF6C3C);box-shadow:0 12px 30px rgba(239,108,60,.3)}
.emblem.danger{background:linear-gradient(135deg,#F05252,#C0392B);box-shadow:0 12px 30px rgba(192,57,43,.3)}
h1{margin:0;font-size:var(--fs-display);line-height:1.12;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--text-2);font-size:var(--fs-body);line-height:1.5;max-width:34ch;text-wrap:pretty}
.features{margin:28px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px}
.features li{display:flex;gap:14px;align-items:flex-start}
.features .fi{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:none}
.features b{display:block;font-weight:600;font-size:var(--fs-callout);line-height:1.3}
.features span.d{display:block;color:var(--text-2);font-size:var(--fs-caption);line-height:1.4;margin-top:2px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.btn{height:54px;border-radius:var(--r-md);font-size:var(--fs-body);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--surface-2);color:var(--text);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent-strong);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.back{align-self:flex-start;display:flex;align-items:center;gap:4px;color:var(--accent);font-size:var(--fs-body);margin:-6px 0 18px -6px;padding:6px}
.field{width:100%;min-height:54px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit;font-size:1rem;padding:15px 16px;outline:0;resize:none}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:120px;font-family:var(--mono);font-size:1rem;line-height:1.45;word-break:break-all}
.hint{color:var(--text-3);font-size:var(--fs-caption);margin:8px 2px 0;line-height:1.4}
.err{color:var(--danger);font-size:var(--fs-caption);min-height:1.4em;margin:10px 2px 0;line-height:1.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.invite-code{font-family:var(--mono);font-size:var(--fs-callout);line-height:1.5;word-break:break-all;color:var(--text);-webkit-user-select:all;user-select:all}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:var(--fs-micro);font-weight:600;letter-spacing:.01em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--text-2)}
.pill .ico{width:.9rem;height:.9rem}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}
.center p{margin:0;color:var(--text-2);max-width:30ch}

/* ---------- passcode ---------- */
.pc{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(36px + env(safe-area-inset-top)) 24px calc(18px + env(safe-area-inset-bottom))}
.pc .emblem{margin-bottom:18px;width:56px;height:56px;border-radius:18px}
.pc h1{font-size:1.5rem;text-align:center}
.pc .lede{text-align:center;margin-top:8px;font-size:var(--fs-callout)}
.dots{display:flex;gap:16px;margin:30px 0 6px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text-3);transition:background .12s,border-color .12s,transform .12s}
.dots i.on{background:var(--text);border-color:var(--text);transform:scale(1.05)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pc .err{text-align:center}
.keypad{margin-top:auto;display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;justify-content:center;padding-top:16px}
.key{width:76px;height:76px;border-radius:50%;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.75rem;font-weight:400;line-height:1;transition:background .1s}
.key small{font-size:.625rem;font-weight:600;letter-spacing:.14em;color:var(--text-2);margin-top:3px}
.key:active{background:var(--surface-3)}
.key.fn{background:transparent;font-size:var(--fs-callout);font-weight:500;color:var(--text-2)}
.key.fn .ico{width:1.6rem;height:1.6rem}
.alpha{width:100%;max-width:340px;margin-top:28px;display:flex;flex-direction:column;gap:10px}
.switch-mode{margin-top:16px;color:var(--accent);font-size:var(--fs-callout);padding:8px}

/* ---------- chat ---------- */
.chat{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);position:relative;z-index:3}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:var(--fs-callout);color:var(--on-accent);background:linear-gradient(135deg,var(--me-1),var(--me-2))}
.who{flex:1;min-width:0}
.who b{display:block;font-size:var(--fs-title);font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .st{display:flex;align-items:center;gap:5px;font-size:var(--fs-micro);color:var(--text-2);line-height:1.3;margin-top:1px;white-space:nowrap}
.who .st .ico{width:.8rem;height:.8rem;color:var(--ok)}
.who .st.unv .ico{color:var(--warn)}
.tb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.tb:active{background:var(--surface-2)}
.banner{flex:none;margin:10px 12px 0;padding:12px 14px;border-radius:var(--r-md);font-size:var(--fs-caption);line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.banner .ico{width:1.1rem;height:1.1rem;margin-top:1px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.danger{background:var(--danger-soft);color:var(--danger)}
.banner b{display:block;font-weight:600}
#list{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:12px 12px 16px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.empty{margin:auto;text-align:center;color:var(--text-2);padding:30px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .emblem{margin:0 0 4px;width:56px;height:56px;border-radius:18px}
.empty b{color:var(--text);font-size:var(--fs-title);font-weight:600}
.empty p{margin:0;font-size:var(--fs-callout);max-width:28ch;line-height:1.5}
.empty .btn{width:auto;padding:0 22px;height:46px;margin-top:6px}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin-top:2px}
.msg.gs{margin-top:12px}
.msg.me{align-items:flex-end}
.daysep{align-self:center;margin:14px 0 6px;font-size:var(--fs-micro);font-weight:600;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase}
.bub{max-width:min(78%,320px);padding:9px 14px;border-radius:20px;background:var(--them);border:1px solid var(--line);font-size:var(--fs-body);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.me .bub{background:linear-gradient(135deg,var(--me-1),var(--me-2));border-color:transparent;color:var(--on-accent)}
.msg:not(.ge) .bub{border-bottom-left-radius:8px}
.msg.me:not(.ge) .bub{border-bottom-left-radius:20px;border-bottom-right-radius:8px}
.msg:not(.gs) .bub{border-top-left-radius:8px}
.msg.me:not(.gs) .bub{border-top-left-radius:20px;border-top-right-radius:8px}
.msg.ge .bub{border-bottom-left-radius:6px}
.msg.me.ge .bub{border-bottom-left-radius:20px;border-bottom-right-radius:6px}
.bub.bad{background:transparent;border:1px dashed var(--line-2);color:var(--text-3);font-style:italic;display:flex;gap:8px;align-items:center}
.meta{display:none;margin:4px 6px 0;font-size:var(--fs-micro);color:var(--text-3);line-height:1.3;gap:6px;align-items:center;white-space:nowrap}
.msg.ge .meta{display:flex}
.meta .ico{width:.85rem;height:.85rem}
.meta .fail{color:var(--danger);font-weight:600}
.bub.media{padding:0;overflow:hidden;width:min(68vw,260px);background:var(--surface-2);border:0;cursor:pointer}
.bub.media .frame{position:relative;width:100%;background:var(--surface-3)}
.bub.media img,.bub.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bub.media img.th{filter:blur(14px);transform:scale(1.15)}
.ovl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff}
.play .ico{width:1.5rem;height:1.5rem;margin-left:3px}
.chip{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;font-size:var(--fs-micro);font-weight:600}
.ring{width:46px;height:46px}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .2s;transform:rotate(-90deg);transform-origin:50% 50%}
.ringwrap{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.bub.voice{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;width:min(72vw,270px)}
.vplay{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-strong);color:#fff}
.me .vplay{background:rgba(255,255,255,.22)}
.vplay .ico{width:1.1rem;height:1.1rem}
.wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;min-width:0}
.wave i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.35}
.wave i.on{opacity:1}
.vdur{font-size:var(--fs-micro);font-weight:600;min-width:2.6em;text-align:end;opacity:.85}

/* composer */
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.cbtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--text-2);background:var(--surface-2);transition:transform .12s,background .12s}
.cbtn:active{transform:scale(.92)}
.cbtn.pri{background:var(--accent-strong);color:var(--on-accent)}
.cbtn .ico{width:1.3rem;height:1.3rem}
.inputwrap{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line-2);border-radius:21px;display:flex}
#txt{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:1rem;line-height:1.35;padding:10px 16px;max-height:132px;resize:none;outline:0;display:block}
#txt::placeholder{color:var(--text-3)}
.rec{flex:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:21px;background:var(--danger-soft);color:var(--danger);min-width:0}
.rec .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
.rec .time{font-weight:600;font-size:var(--fs-callout);min-width:3.2em}
.rec .wave{color:var(--danger);height:24px;overflow:hidden;justify-content:flex-end}
.rec .wave i{flex:none;width:3px;opacity:.9}
.cbtn.del{background:transparent;color:var(--danger)}

/* sheets, dialogs, viewer, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--elev);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;overscroll-behavior:contain}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 12px}
.sheet h2{margin:2px 4px 14px;font-size:var(--fs-title);font-weight:600;line-height:1.25}
.opts{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:start;width:100%;font-size:var(--fs-body);border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt:active{background:var(--surface-2)}
.opt .oi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.opt .oi .ico{width:1.15rem;height:1.15rem}
.opt .ot{flex:1;min-width:0}
.opt .ot small{display:block;color:var(--text-3);font-size:var(--fs-caption);line-height:1.35;margin-top:1px}
.opt.danger{color:var(--danger)}
.opt.danger .oi{background:var(--danger-soft);color:var(--danger)}
.sect{margin:18px 4px 8px;font-size:var(--fs-micro);font-weight:600;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase}
.safety{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;font-family:var(--mono);font-size:1.0625rem;letter-spacing:.06em;text-align:center;font-variant-numeric:tabular-nums;padding:6px 0 2px}
.sheet .cancel{margin-top:10px}
.dialog{position:fixed;left:50%;top:50%;z-index:61;width:min(86vw,330px);transform:translate(-50%,-50%) scale(.96);opacity:0;transition:opacity .18s,transform .18s;background:var(--elev);border-radius:var(--r-lg);padding:22px 20px 16px;box-shadow:var(--shadow);text-align:center}
.dialog.show{opacity:1;transform:translate(-50%,-50%)}
.dialog h3{margin:0 0 8px;font-size:var(--fs-title);font-weight:600;line-height:1.3}
.dialog p{margin:0 0 18px;color:var(--text-2);font-size:var(--fs-callout);line-height:1.45;text-wrap:pretty}
.dialog .actions{margin-top:0;gap:8px}
.dialog .btn{height:48px}
.scrim.top{z-index:60}
.viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;animation:in .2s}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;color:#fff;position:relative;z-index:2;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.viewer .vbar .tb{color:#fff}
.viewer .vbar .vt{flex:1;min-width:0;font-size:var(--fs-caption);line-height:1.3;text-align:center}
.viewer .vbar .vt b{display:block;font-size:var(--fs-callout);font-weight:600}
.viewer .stage{flex:1;display:grid;place-items:center;min-height:0;margin-top:-56px}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:70;transform:translate(-50%,-140%);opacity:0;visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility .3s;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:var(--fs-caption);font-weight:500;line-height:1.35;max-width:90vw;box-shadow:var(--shadow);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="root"></div>
<input type="file" id="fCamera" class="hidden" accept="image/*,video/*" capture="environment">
<input type="file" id="fLibrary" class="hidden" accept="image/*,video/*" multiple>
<input type="file" id="fAudio" class="hidden" accept="audio/*">
<script nonce="__NONCE__">

function passcodeSetup(then, back) {
  let first = null;
  passcodeView({
    title: 'Create a passcode', lede: 'It seals your keys on this phone. There is no recovery if you forget it.',
    allowSwitch: true, back,
    onSubmit: async (val, mode) => {

      if (mode === 'a' && val.length < 8) return 'Use at least 8 characters.';
      if (/^(\d)\1{5}$|^(012345|123456|234567|345678|456789|987654|654321)$/.test(val)) return 'Too easy to guess. Choose another.';
      first = { val, mode };

        title: 'Confirm passcode', lede: 'Enter it once more.', mode, back: () => passcodeSetup(then, back),
        onSubmit: async (v2) => {

/* ---------------- create / join / invite ---------------- */
async function createFlow(pass, mode) {
  try {
    const kp = await genKeyPair();
    await signIn();
    const r = await rpc('create_space');
    await createVault(pass, mode, { space: r.space_id, role: 'c', priv: kp.priv, pub: kp.pub, published: false, secrets: [], name: '', verified: false });
    ST.space = r.space_id; await save('space', r.space_id);
    await publishKey();
    const inv = await addInviteSecret(r.code);
    await enterChat(false);
    inviteSheet(inv);
  } catch (e) { WRAP = null; V = null; failed(e, welcome); }
}
async function publishKey(mac) {
  await rpc('publish_key', { p_space: V.space, p_payload: JSON.stringify(mac ? { v: 2, pub: V.pub, mac } : { v: 2, pub: V.pub }) });
  if (!V.published) { V.published = true; await sealVault(); }
}
async function addInviteSecret(code) {
  const s = b64u(rnd(16));
  V.secrets = (V.secrets || []).concat([{ s, at: Date.now() }]).slice(-8);
  await sealVault();
  return 'PVT2.' + code + '.' + (await fingerprint(V.pub)) + '.' + s;
}
function parseInvite(v) {
  const p = String(v || '').replace(/\s+/g, '').split('.');
  if (p.length !== 4 || p[0] !== 'PVT2' || !/^[A-Za-z0-9]{6,20}$/.test(p[1]) || p[2].length !== 22 || p[3].length !== 22) return null;
  return { code: p[1], fp: p[2], s: p[3] };
}

async function joinFlow(inv, pass, mode) {
  try {
    const kp = await genKeyPair();
    await signIn();
    const sid = await rpc('join_space', { p_code: inv.code });
    await createVault(pass, mode, { space: sid, role: 'j', priv: kp.priv, pub: kp.pub, inv: { fp: inv.fp, s: inv.s }, published: false, name: '', verified: false });
    ST.space = sid; await save('space', sid);
    busy('Verifying your partner', 'Checking their key against the invite…');
    await handshake();
    await enterChat(true);
  } catch (e) { WRAP = null; V = null; failed(e, welcome); }
}

/* Key agreement. Creator: verify the joiner's HMAC (proves they hold the invite secret).
   Joiner: verify the creator's key matches the invite fingerprint, then publish its own key + HMAC. */
async function handshake() {
  if (!V || V.mk || V.alert) return;
  if (!V.published && V.role === 'c') await publishKey();
  const rows = await api('/rest/v1/handshakes?select=user_id,payload&space_id=eq.' + V.space);
  const other = (rows || []).find((r) => r.user_id !== ST.session.user_id);
  if (!other) return;
  let p; try { p = JSON.parse(other.payload); } catch (e) { return; }
  if (!p || typeof p.pub !== 'string') return;
  if (V.role === 'j') {
    if (!ctEq(te.encode(await fingerprint(p.pub)), te.encode(V.inv.fp))) {
      V.alert = 'fpmismatch'; await sealVault();
      throw new AppError('The server returned a key that does not match your invite. Do not use this space; ask for a new invite.');
    }
    const mac = b64u(await hmac(V.inv.s, joinMsg(V.space, V.pub)));
    await publishKey(mac);
    V.mk = await deriveMessageKey(V.priv, p.pub, V.space);
    V.peer = p.pub; delete V.inv; await sealVault();
  } else {
    if (typeof p.mac !== 'string') return;
    let ok = false, mac;
    try { mac = unb64u(p.mac); } catch (e) { mac = new Uint8Array(0); }
    for (const x of V.secrets || []) if (ctEq(await hmac(x.s, joinMsg(V.space, p.pub)), mac)) ok = true;
    if (!ok) { V.alert = 'badjoin'; await sealVault(); renderChrome(); return; }
    V.mk = await deriveMessageKey(V.priv, p.pub, V.space);
    V.peer = p.pub; V.secrets = []; await sealVault();
  }
  MK = await aesKey(unb64u(V.mk));
  renderChrome();
  toast('Paired. You’re end-to-end encrypted.');
}
async function checkPeerKey() {
  if (!V || !V.peer) return;
  try {
    const rows = await api('/rest/v1/handshakes?select=user_id,payload&space_id=eq.' + V.space);
    const other = (rows || []).find((r) => r.user_id !== ST.session.user_id);
    const p = other ? JSON.parse(other.payload) : null;
    if (p && p.pub && p.pub !== V.peer && V.alert !== 'keychange') { V.alert = 'keychange'; await sealVault(); renderChrome(); }
  } catch (e) { /* offline is fine */ }
}

/* ---------------- polling ---------------- */
function startPolling() { stopPolling(); poll(); pollTimer = setInterval(poll, 3000); }
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
async function poll() {
  if (polling || !V) return;
  polling = true;
  try {
    if (!MK) { await handshake(); if (!MK) return; }
    const base = '/rest/v1/messages?select=id,sender_id,ciphertext,created_at,expires_at&space_id=eq.' + V.space;
    let rows;
    if (!cursor) {
      rows = await api(base + '&expires_at=gt.' + encodeURIComponent(new Date().toISOString()) + '&order=created_at.desc&limit=300');
      rows.reverse();
    } else {
      // overlap 5 s: a row that commits late with an earlier timestamp is still picked up (ids dedupe)
      rows = await api(base + '&created_at=gte.' + encodeURIComponent(new Date(Date.parse(cursor) - 5000).toISOString()) + '&order=created_at.asc&limit=200');
    }
    if (rows && rows.length) { const last = rows[rows.length - 1].created_at; if (!cursor || Date.parse(last) > Date.parse(cursor)) cursor = last; await ingest(rows); }
    if (++tick % 20 === 1) {
      const m = await api('/rest/v1/members?select=user_id&space_id=eq.' + V.space);
      partnerCount = (m || []).length;
    }
    if (tick % 20 === 0) renderList(); // refresh expiry labels, drop expired
    if (!cleaned) { cleaned = true; cleanupMedia(); }
  } catch (e) {
    if (e instanceof AppError && /sign-in expired/.test(e.message)) toast(e.message, 5000);
  } finally { polling = false; }
}

/* ---------------- messages ---------------- */
const aadMsg = () => 'pvt2|' + V.space;
async function encryptEnvelope(env) {
  return 'v2.' + b64(await seal(MK, te.encode(JSON.stringify(env)), aadMsg()));
}
async function openRow(row) {
  if (typeof row.ciphertext !== 'string' || row.ciphertext.slice(0, 3) !== 'v2.') return null;
  try {
    const env = JSON.parse(td.decode(await unseal(MK, unb64(row.ciphertext.slice(3)), aadMsg())));
    if (env.v !== 2 || env.s !== row.sender_id) return null; // sender is bound inside the ciphertext
    return env;
  } catch (e) { return null; }
}
async function ingest(rows) {
  let changed = false, newest = 0;
  for (const r of rows) {
    if (BYID.has(r.id)) continue;
    const env = await openRow(r);
    const created = Date.parse(r.created_at), expires = Date.parse(r.expires_at);
    newest = Math.max(newest, created);
    if (env && BYNONCE.has(env.n)) {
      const local = BYNONCE.get(env.n);
      if (local.id !== r.id && local.status !== 'sent') { BYID.delete(local.id); local.id = r.id; local.created = created; local.expires = expires; local.status = 'sent'; BYID.set(r.id, local); changed = true; }
      else if (!BYID.has(r.id)) BYID.set(r.id, local); // replayed copy of a message we already have
      continue;
    }
    const m = { id: r.id, me: r.sender_id === ST.session.user_id, created, expires, env, status: 'sent' };
    BYID.set(r.id, m); if (env) BYNONCE.set(env.n, m);
    LIST.push(m); changed = true;
  }
  if (changed) { LIST.sort((a, b) => a.created - b.created); renderList(true); }
  if (newest) save('seen', new Date(newest + 1).toISOString()).catch(() => {});
}

async function postEnvelope(env) {
  const ct = await encryptEnvelope(env);
  const rows = await api('/rest/v1/messages', { method: 'POST', headers: { Prefer: 'return=representation' },
    body: JSON.stringify({ space_id: V.space, message_type: 'text', ciphertext: ct, expires_at: new Date(Date.now() + TTL).toISOString() }) });
  return rows;
}
function newEnvelope(type, extra) { return Object.assign({ v: 2, s: ST.session.user_id, n: b64u(rnd(12)), t: type, ts: Date.now() }, extra); }
function addLocal(env, extra) {
  const m = Object.assign({ id: 'local-' + env.n, me: true, created: Date.now(), expires: Date.now() + TTL, env, status: 'sending' }, extra || {});
  BYID.set(m.id, m); BYNONCE.set(env.n, m); LIST.push(m); renderList(true, true);
  return m;
}
function markFailed(m, e) { m.status = 'failed'; m.error = friendly(e); updateRow(m); toast('Not sent: ' + m.error, 4000); }

async function sendText(text) {
  const env = newEnvelope('text', { b: text });
  const m = addLocal(env);
  try { await ingest(await postEnvelope(env)); } catch (e) { markFailed(m, e); m.retry = () => sendRetry(m); }
}
async function sendRetry(m) {
  m.status = 'sending'; updateRow(m);
  try {
    if (m.upload && !m.uploaded) await m.upload();
    await ingest(await postEnvelope(m.env));
  } catch (e) { markFailed(m, e); }
}

/* ---------------- list rendering (keyed, so media and audio survive updates) ---------------- */
const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function dayLabel(t) {
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return 'Today';
  const y = new Date(n); y.setDate(n.getDate() - 1);
  return d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'long' });
}
function leftLabel(m) {
  const ms = m.expires - Date.now(); if (ms <= 0) return null;
  const hrs = Math.floor(ms / 36e5); return hrs >= 1 ? hrs + 'h' : Math.max(1, Math.floor(ms / 6e4)) + 'm';
}
function renderList(newItems, forceBottom) {
  const L = $('#list'); if (!L || !V) return;
  const atBottom = L.scrollHeight - L.scrollTop - L.clientHeight < 140;
  const now = Date.now();
  for (const m of LIST) if (m.expires <= now && m.status === 'sent') { if (m.node) m.node.remove(); if (m.url) URL.revokeObjectURL(m.url); m.dead = true; }
  LIST = LIST.filter((m) => !m.dead);
  let empty = $('.empty', L);
  if (!LIST.length) {
    if (!empty) { L.replaceChildren(emptyState()); }
    else empty.replaceWith(emptyState());
    return;
  }
  if (empty) empty.remove();
  let at = L.firstChild;
  for (let i = 0; i < LIST.length; i++) {
    const m = LIST[i], prev = LIST[i - 1], next = LIST[i + 1];
    if (!m.node) m.node = buildRow(m);
    if (m.node !== at) L.insertBefore(m.node, at); else at = at.nextSibling;
    const newDay = !prev || dayLabel(prev.created) !== dayLabel(m.created);
    const gs = newDay || prev.me !== m.me || m.created - prev.created > 5 * 6e4;
    const ge = !next || next.me !== m.me || next.created - m.created > 5 * 6e4 || dayLabel(next.created) !== dayLabel(m.created) || m.status !== 'sent';
    m.node.classList.toggle('gs', gs); m.node.classList.toggle('ge', ge);
    const ds = m.node.firstChild; ds.classList.toggle('hidden', !newDay); if (newDay) ds.textContent = dayLabel(m.created);
    if (ge) updateMeta(m);
  }
  if (forceBottom || (newItems && atBottom)) requestAnimationFrame(() => { L.scrollTop = L.scrollHeight; });
}
function emptyState() {
  if (!MK) {
    const creator = V.role === 'c';
    return h('div', { class: 'empty' }, h('div', { class: 'emblem' }, icon(creator ? 'link' : 'clock')),
      h('b', { text: creator ? 'Waiting for your partner' : 'Finishing pairing' }),
      h('p', { text: creator ? 'Send them an invite. You can chat as soon as their phone joins and the keys are verified.' : 'Waiting for your partner’s phone to confirm. Keep the app open for a moment.' }),
      creator && V.alert !== 'badjoin' ? h('button', { class: 'btn pri', onclick: async () => {
        try { const c = await rpc('new_invite', { p_space: V.space }); inviteSheet(await addInviteSecret(c)); } catch (e) { toast(friendly(e)); }
      } }, icon('share'), 'Send invite') : null);
  }
  return h('div', { class: 'empty' }, h('div', { class: 'emblem' }, icon('shield')),
    h('b', { text: 'Say something' }),
    h('p', { text: 'Messages, photos, videos and voice notes are end-to-end encrypted and disappear after 24 hours.' }));
}
function updateMeta(m) {
  const meta = m.node.lastChild;
  const kids = [h('span', { class: 'tnum', text: fmtTime(m.created) })];
  if (m.status === 'sending') kids.push(h('span', { text: '·' }), h('span', { text: 'Sending…' }));
  else if (m.status === 'failed') kids.push(h('span', { text: '·' }), h('button', { class: 'fail', onclick: () => m.retry ? m.retry() : sendRetry(m) }, 'Not sent · Retry'));
  else { const l = leftLabel(m); if (l) kids.push(h('span', { text: '·' }), icon('timer'), h('span', { class: 'tnum', text: l })); }

    h('div', { class: 'rec', role: 'status', 'aria-label': 'Recording' }, h('span', { class: 'dot' }), time, live),
    h('button', { class: 'cbtn pri', 'aria-label': 'Send voice note', onclick: () => stopRecording(true) }, icon('send')));

async function settingsSheet() {
  const opt = (ic, t, d, fn, cls) => h('button', { class: 'opt' + (cls ? ' ' + cls : ''), onclick: fn }, h('span', { class: 'oi' }, icon(ic)), h('span', { class: 'ot' }, t, d ? h('small', { text: d }) : null));
  const nameIn = h('input', { class: 'field', value: V.name || '', placeholder: 'Partner', maxlength: '40', 'aria-label': 'Partner name', autocomplete: 'off' });
  nameIn.addEventListener('change', async () => { V.name = nameIn.value.trim().slice(0, 40); await sealVault().catch(() => {}); renderChrome(); });
  const parts = [h('div', { class: 'sect', text: 'Name on this phone' }), nameIn];
  if (V.peer) {
    const sn = await safetyNumber(V.pub, V.peer);
    parts.push(h('div', { class: 'sect', text: 'Safety number' }),
      h('div', { class: 'card' },
        h('div', { class: 'safety', translate: 'no', 'aria-label': 'Safety number ' + sn.join(' ') }, sn.map((g) => h('span', { text: g }))),
        h('p', { class: 'hint', style: 'text-align:center', text: 'Compare these numbers with your partner in person or on a call. If they match, nobody is in the middle.' }),
        h('div', { style: 'display:flex;justify-content:center;margin-top:10px' }, V.verified
          ? h('span', { class: 'pill ok' }, icon('check'), 'Verified')
          : h('button', { class: 'btn pri', style: 'height:44px;width:auto;padding:0 18px', onclick: async () => {
            if (await confirmDialog('Numbers match?', 'Only mark as verified after comparing all 30 digits with your partner.', 'They match')) { V.verified = true; await sealVault(); renderChrome(); closeSheet(); toast('Marked as verified'); }
          } }, 'Mark as verified'))));
  }
  const items = [];
  if (V.role === 'c' && partnerCount < 2 && !MK) items.push(opt('share', 'Invite partner', 'Create a new one-time invite', async () => { try { const c = await rpc('new_invite', { p_space: V.space }); closeSheet(true); inviteSheet(await addInviteSecret(c)); } catch (e) { toast(friendly(e)); } }));
  items.push(opt('lock', 'Lock now', 'Auto-locks a minute after you leave', () => { closeSheet(true); lockNow(); }));
  items.push(opt('trash', 'Reset this phone', 'Delete keys and pairing from this phone', resetPhone, 'danger'));
  parts.push(h('div', { class: 'sect', text: 'Security' }), h('div', { class: 'opts' }, items),
    h('p', { class: 'hint', style: 'text-align:center;margin-top:16px', text: 'pvtshiiiiii ' + VERSION + ' · messages expire after 24 hours' }));
  sheet('Settings', parts);
}

/* ---------------- lock / lifecycle ---------------- */
function lockNow(silent) {
  stopPolling();
  if (REC) stopRecording(false);
  if (currentAudio) currentAudio.pause();
  for (const m of LIST) { if (m.url) URL.revokeObjectURL(m.url); m.url = null; m.blob = null; }
  LIST = []; BYID = new Map(); BYNONCE = new Map();
  MK = null; V = null; WRAP = null;
  document.querySelectorAll('.viewer,.sheet,.scrim,.dialog').forEach((n) => n.remove()); sheetEls = null;
  if (!silent && ST.vault) lockScreen();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (V && hiddenAt && Date.now() - hiddenAt > AUTOLOCK_MS) lockNow();
  else if (V) poll();
  hiddenAt = 0;
});

/* ---------------- keyboard: keep composer above the iOS keyboard ---------------- */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    const r = $('#root'); if (!r) return;
    r.style.height = vv.height + 'px';
    window.scrollTo(0, 0);
    const L = $('#list'), a = document.activeElement;
    if (L && a && a.id === 'txt') L.scrollTop = L.scrollHeight;
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', () => window.scrollTo(0, 0));
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!subtle) return fatal('Encryption unavailable', 'This view has no Web Crypto, so nothing was sent or stored.');
  if (!CFG.url || !CFG.key || CFG.key.indexOf('PASTE') === 0) return fatal('Not configured', 'Add your Supabase URL and publishable key at the top of the script, then run it again.');
  if (ST.legacy) return upgradeScreen();
  if (ST.vault && ST.vault.c) return lockScreen();
  welcome();
}
boot();
</script>
